<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blueprint Models</title>
<!-- Vercel Web Analytics: page views for the gallery (turn Analytics on in the Vercel project to start collecting) -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* The home page is a grid of every model; a model opens in a full-window frame, one page at a time.
   tools/build.js fills in the placeholders below; the grid's pictures are thumbs/<id>.webp (tools/thumbs.js). */
:root { --bg: #141414; --fg: #ffffff; --fg-2: rgba(255,255,255,.64); --fg-3: rgba(255,255,255,.4); --rule: rgba(255,255,255,.14); --tile: rgba(255,255,255,.025);
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; --display: "Archivo", "Helvetica Neue", Arial, sans-serif; }
/* nothing from the browser's own look: selection, scrollbars, focus rings and search boxes are the site's */
* { -webkit-tap-highlight-color: transparent; }
::selection { background: var(--fg); color: var(--bg); }
html { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 8px; }
:focus { outline: none; }
:focus-visible { outline: 1px dashed var(--fg); outline-offset: 3px; }
input[type="search"]::-webkit-search-cancel-button, input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; transition: background-color .45s ease, color .45s ease; }
iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; opacity: 0; transition: opacity .35s ease; }
iframe.shown { opacity: 1; }

#home { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; transition: opacity .3s ease; }
#home[hidden] { display: none; }
/* the hero: half the viewport, everything centred; a slim bar on top with the docs link and the theme swatches */
.hero { position: relative; min-height: 50vh; min-height: 50svh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 18px; padding: calc(env(safe-area-inset-top, 0px) + 72px) clamp(16px, 4vw, 56px) 48px; }
.topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) clamp(16px, 4vw, 56px) 0; }
.topbar .mark { font: 800 15px/1 var(--display); font-stretch: 125%; letter-spacing: -.01em; color: var(--fg); text-decoration: none; }
.topbar nav { display: flex; align-items: center; gap: 12px; }
.pill { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); text-decoration: none;
  border: 1px solid var(--rule); border-radius: 999px; padding: 11px 14px; transition: border-color .2s, color .2s; }
.pill:hover, .pill:focus-visible { color: var(--fg); border-color: var(--fg); outline: none; }
.hero h1 { margin: 0; font: 800 clamp(34px, 6.4vw, 92px)/.95 var(--display); font-stretch: 125%; letter-spacing: -.035em; }
.hero p { margin: 0; max-width: 560px; font: 400 clamp(12px, 1.1vw, 15px)/1.6 var(--mono); letter-spacing: .02em; color: var(--fg-2); }
.hero-actions { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; width: 100%; margin-top: 6px; }
.pill.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pill.solid:hover { opacity: .88; color: var(--bg); }
.home-search { width: min(340px, 100%); text-align: center; font: 500 12px/1 var(--mono); letter-spacing: .06em; color: var(--fg); background: transparent;
  border: 1px solid var(--rule); border-radius: 999px; padding: 12px 16px; outline: none; transition: border-color .2s; -webkit-appearance: none; appearance: none; }
.home-search::placeholder { color: var(--fg-3); text-transform: uppercase; letter-spacing: .1em; }
.home-search:focus, .home-search:hover { border-color: var(--fg); }
.home-themes { display: flex; gap: 6px; padding: 5px; border: 1px solid var(--rule); border-radius: 999px; }
.home-themes button { width: 26px; height: 26px; border-radius: 50%; padding: 0; cursor: pointer; border: 1px solid var(--rule);
  background: linear-gradient(135deg, var(--sw-bg) 50%, var(--sw-fg) 50%); transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
.home-themes button.inv { background: linear-gradient(135deg, var(--sw-fg) 50%, var(--sw-bg) 50%); }
.home-themes button:hover { transform: scale(1.12); }
.home-themes button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--fg); }

/* three columns across the full width, no gaps: the cells are divided by hairlines (each draws its right and bottom
   edge; the right-hand column's is clipped off at the window's edge) */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule); overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 0px); }
.tile { position: relative; display: block; color: inherit; text-decoration: none; outline: none; box-shadow: 1px 0 0 var(--rule), 0 1px 0 var(--rule); transition: background-color .25s; }
.tile[hidden] { display: none; }
.tile:hover, .tile:focus-visible { background: var(--tile); }
.art { position: relative; aspect-ratio: 4 / 3; }
.art::before { content: ""; position: absolute; inset: 9% 9% 14%; background: var(--fg); opacity: .88;
  -webkit-mask: var(--img) center / contain no-repeat; mask: var(--img) center / contain no-repeat; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .25s; }
.tile:hover .art::before, .tile:focus-visible .art::before { transform: scale(1.04); opacity: 1; }
.cap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 0 clamp(10px, 1.6vw, 24px) clamp(10px, 1.4vw, 20px); }
.cap b { font: 500 clamp(9px, 1vw, 13px)/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.cap span { font: 400 clamp(8px, .85vw, 11px)/1.3 var(--mono); letter-spacing: .06em; color: var(--fg-3); text-transform: lowercase; white-space: nowrap; }
.tile:hover .cap span, .tile:focus-visible .cap span { color: var(--fg-2); }
.empty { grid-column: 1 / -1; font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); padding: 4vw 0; text-align: center; }
@media (max-width: 760px) { .cap span { display: none; } .topbar .mark { display: none; } .topbar { justify-content: flex-end; } }
@media (prefers-reduced-motion: reduce) { .art::before { transition: none; } }
</style>
</head>
<body>
<main id="home" hidden>
  <header class="hero">
    <div class="topbar">
      <a class="mark" href="./">Blueprint Models</a>
      <nav><a class="pill" href="docs/">Embed docs</a><div class="home-themes" id="home-themes" role="group" aria-label="Theme"></div></nav>
    </div>
    <h1>Blueprint Models</h1>
    <p><span id="home-count"></span> you can turn, take apart and see working, and drop into your own site or app.</p>
    <div class="hero-actions">
      <input class="home-search" id="home-search" type="search" placeholder="Search models" aria-label="Search models" autocomplete="off" spellcheck="false">
      <a class="pill solid" href="docs/">Embed them</a>
    </div>
  </header>
  <div class="grid" id="grid"></div>
</main>
<!--PAGE_JS-->
<script>
(function () {
  "use strict";
  /* Filled in by tools/build.js. Two builds share this shell:
     - dist/index.html (Vercel): MODELS entries carry `src` (m/<id>.html), a small page that loads the shared engine
       and its own geometry and model files when opened; TEMPLATES and ENGINE stay empty.
     - index.html (one file, opens from disk): MODELS entries carry the template name, the page's strings and the
       geometry and model code; TEMPLATES and ENGINE hold the two page templates and the engine once, and the
       PAGE_JS slot above holds templates/page.js, which puts a page together when it's opened. */
  const MODELS = /*MODELS*/[];
  const TEMPLATES = /*TEMPLATES*/{};
  const ENGINE = /*ENGINE*/"";
  const DEFAULT = "macintosh";
  // background / line colour per theme, as in the pages; a theme is stored as "name" or "name:inv"
  const THEMES = { dark: ["#141414", "#ffffff"], light: ["#f3f3f1", "#141414"], amber: ["#ffdf77", "#141414"],
    navy: ["#0d2c51", "#ffffff"], lime: ["#c8f25c", "#123d22"] };
  const root = document.documentElement;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let style = store.get("blueprints-style");
  if (!["blueprint", "realistic", "photo"].includes(style)) style = "blueprint";
  let theme = store.get("blueprints-theme") || "dark";
  if (!THEMES[theme.split(":")[0]]) theme = "dark";
  const rgba = (hex, a) => "rgba(" + [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(", ") + ", " + a + ")";
  function paint() {
    const [t, inv] = theme.split(":");
    let [bg, fg] = THEMES[t];
    if (inv === "inv") [bg, fg] = [fg, bg];
    const s = root.style;
    s.setProperty("--bg", bg); s.setProperty("--fg", fg); s.setProperty("--fg-2", rgba(fg, 0.64)); s.setProperty("--fg-3", rgba(fg, 0.42));
    s.setProperty("--rule", rgba(fg, 0.16)); s.setProperty("--tile", rgba(fg, 0.03));
    document.querySelectorAll("#home-themes button").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.t === t));
      b.classList.toggle("inv", b.dataset.t === t && inv === "inv");
    });
  }

  // styles for the model dropdown, added to each page; it uses the page's own theme colours
  const CSS = `
    * { -webkit-tap-highlight-color: transparent; }
    ::selection { background: var(--fg); color: var(--bg); }
    html { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 8px; }
    input[type="search"]::-webkit-search-cancel-button, input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
    .bp-controls { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
    .bp-controls * { pointer-events: auto; }
    .bp-model { position: relative; display: flex; align-items: center; }
    .bp-home {
      flex: none; display: flex; align-items: center; gap: 8px; pointer-events: auto; cursor: pointer;
      font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2);
      background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 11px 14px;
      transition: border-color .2s, color .2s;
    }
    .bp-home:hover { color: var(--fg); border-color: var(--fg); }
    .bp-home:focus-visible { outline: 1px dashed var(--fg); outline-offset: 2px; }
    .bp-home svg { width: 12px; height: 12px; }
    @media (max-width: 760px) { .bp-home span { display: none; } }
    .bp-style { display: flex; padding: 3px; border: 1px solid var(--rule); border-radius: 999px; }
    .bp-style button {
      font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2);
      background: transparent; border: 0; border-radius: 999px; padding: 9px 12px; cursor: pointer;
      transition: background-color .2s, color .2s;
    }
    .bp-style button:hover { color: var(--fg); }
    .bp-style button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
    .bp-style button:focus-visible { outline: 1px dashed var(--fg); outline-offset: 2px; }
    .page { z-index: 6; }
    .bp-model input {
      width: 190px; cursor: pointer;
      font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg);
      background: transparent; border: 1px solid var(--rule); border-radius: 999px;
      padding: 11px 36px 11px 16px; transition: border-color .2s;
    }
    .bp-model input::placeholder { color: var(--fg-3); }
    .bp-model input:hover { border-color: var(--fg); }
    .bp-model input:focus { cursor: text; border-color: var(--fg); outline: none; text-transform: none; letter-spacing: .02em; }
    .bp-model::after {
      content: ""; position: absolute; right: 16px; top: 50%; width: 6px; height: 6px; pointer-events: none;
      border-right: 1.5px solid var(--fg); border-bottom: 1.5px solid var(--fg); transform: translateY(-70%) rotate(45deg);
      transition: transform .2s;
    }
    .bp-model.open::after { transform: translateY(-25%) rotate(225deg); }
    .bp-list {
      position: absolute; top: calc(100% + 6px); left: 0; min-width: 100%; margin: 0; padding: 5px; list-style: none;
      background: var(--panel); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border: 1px solid var(--rule); border-radius: 14px; max-height: 60vh; overflow: auto; z-index: 8;
      overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch;
    }
    /* with the picker in the header there's no room for the subtitle on smaller screens */
    @media (max-width: 1180px) { .mark span { display: none; } }
    .bp-list[hidden] { display: none; }
    .bp-list li {
      display: flex; justify-content: space-between; gap: 16px; padding: 10px 12px; border-radius: 9px; cursor: pointer;
      font: 500 12px/1.2 var(--mono); letter-spacing: .06em; color: var(--fg-2); white-space: nowrap;
    }
    .bp-list li small { font: inherit; color: var(--fg-3); text-transform: lowercase; letter-spacing: .02em; }
    .bp-list li[aria-selected="true"] { background: var(--fg); color: var(--bg); }
    .bp-list li[aria-selected="true"] small { color: var(--bg); opacity: .7; }
    .bp-list li.current:not([aria-selected="true"]) { color: var(--fg); }
    .bp-list .none { cursor: default; color: var(--fg-3); }
    .bp-list li.group {
      cursor: default; padding: 12px 12px 6px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3);
    }
    .bp-list li.group:first-child { padding-top: 7px; }
    .bp-list li.group:not(:first-child) { margin-top: 4px; border-top: 1px solid var(--rule); border-radius: 0; }
    /* on a phone the dropdown takes its own row under the brand and swatches */
    @media (max-width: 760px) {
      header { flex-wrap: wrap; row-gap: 12px; }
      .mark span { display: none; }
      .themes { margin-left: auto; }
      .tools { order: 4; }
      .bp-controls { order: 3; flex: 1 1 auto; min-width: 0; }
      .bp-model { flex: 1; }
      .bp-model input { width: 100%; padding: 10px 34px 10px 14px; font-size: 11px; }
    }
    /* phones: the picker opens as an opaque bottom sheet, its search box at the top */
    .bp-scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .5); animation: bp-fade .2s ease; }
    .bp-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; display: flex; flex-direction: column; max-height: 82vh;
      background: var(--bg); color: var(--fg); border-top: 1px solid var(--rule); border-radius: 20px 20px 0 0;
      padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -12px 40px rgba(0, 0, 0, .35);
      animation: bp-up .28s cubic-bezier(.2, .8, .2, 1);
    }
    .bp-scrim[hidden], .bp-sheet[hidden] { display: none; }
    .bp-grip { flex: none; width: 40px; height: 4px; margin: 2px auto 12px; border-radius: 2px; background: var(--rule); }
    .bp-sheet-head { flex: none; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .bp-sheet-head input {
      flex: 1; min-width: 0; font: 400 16px/1.2 var(--body); color: var(--fg); background: transparent;
      border: 1px solid var(--rule); border-radius: 999px; padding: 12px 16px; outline: none; -webkit-appearance: none; appearance: none;
    }
    .bp-sheet-head input::placeholder { color: var(--fg-3); }
    .bp-sheet-head input:focus { border-color: var(--fg); }
    .bp-x {
      flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--rule); background: transparent;
      color: var(--fg); font: 400 22px/1 var(--body); cursor: pointer;
    }
    .bp-sheet .bp-list {
      position: static; flex: 1 1 auto; min-height: 0; max-height: none; padding: 0 0 4px; border: 0; border-radius: 0;
      background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none;
    }
    .bp-sheet .bp-list li { padding: 14px 12px; font-size: 13px; }
    .bp-sheet .bp-list li.group { padding: 16px 12px 6px; font-size: 10px; }
    @keyframes bp-up { from { transform: translateY(100%); } }
    @keyframes bp-fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .bp-sheet, .bp-scrim { animation: none; } }`;

  // ---------- the home page: every model in a three-column grid ----------
  const home = document.getElementById("home"), grid = document.getElementById("grid"), search = document.getElementById("home-search");
  document.getElementById("home-count").textContent = MODELS.length + " interactive illustrations";
  const themesEl = document.getElementById("home-themes");
  Object.entries(THEMES).forEach(([t, [bg, fg]]) => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.t = t; b.title = t[0].toUpperCase() + t.slice(1) + " theme (click again to invert)";
    b.style.setProperty("--sw-bg", bg); b.style.setProperty("--sw-fg", fg);
    // a new swatch switches theme; the active one again swaps its background and lines
    b.addEventListener("click", () => {
      const [cur, inv] = theme.split(":");
      theme = t === cur ? (inv === "inv" ? t : t + ":inv") : t;
      store.set("blueprints-theme", theme); paint();
    });
    themesEl.appendChild(b);
  });
  paint();
  const tiles = MODELS.map(m => {
    const a = document.createElement("a");
    a.className = "tile"; a.href = "#" + m.id; a.title = m.label;
    const art = document.createElement("div");
    art.className = "art"; art.style.setProperty("--img", "url('thumbs/" + m.id + ".webp')");
    const cap = document.createElement("div");
    cap.className = "cap";
    const b = document.createElement("b"), sp = document.createElement("span");
    b.textContent = m.label; sp.textContent = m.category || m.kind || "";
    cap.append(b, sp); a.append(art, cap);
    grid.appendChild(a);
    return { a, m };
  });
  const none = document.createElement("p");
  none.className = "empty"; none.textContent = "No matching model"; none.hidden = true; grid.appendChild(none);
  const norm = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  search.addEventListener("input", () => {
    const words = norm(search.value).split(/\s+/).filter(Boolean);
    let n = 0;
    tiles.forEach(({ a, m }) => { const ok = words.every(w => norm(m.label + " " + m.id + " " + (m.tags || "") + " " + (m.category || "")).includes(w)); a.hidden = !ok; n += ok; });
    none.hidden = n > 0;
  });
  function showHome() {
    current = null;
    if (frame) { const f = frame; frame = null; f.classList.remove("shown"); setTimeout(() => f.remove(), 350); }
    document.title = "Blueprint Models";
    paint();
    home.hidden = false;
  }

  let frame = null, current = null;
  function show(id) {
    const m = MODELS.find(x => x.id === id);
    if (!m) { if (location.hash) history.replaceState(null, "", location.pathname + location.search); return showHome(); }
    if (current === m.id && frame) return;
    current = m.id;
    home.hidden = true;
    store.set("blueprints-model", m.id);
    if (location.hash.slice(1) !== m.id) history.replaceState(null, "", "#" + m.id);
    // each page reads its theme from its own key at startup: hand it the current one
    MODELS.forEach(x => store.set(x.key, theme));
    const old = frame;
    frame = document.createElement("iframe");
    frame.title = m.label;
    frame.addEventListener("load", () => attach(frame, m), { once: true });
    if (m.src) frame.src = m.src;
    else frame.srcdoc = BP_page.pageHtml(TEMPLATES[m.template], m, { geometry: { code: m.geometry }, model: { code: m.model }, engine: { code: ENGINE } });
    document.body.appendChild(frame);
    // the old page goes once the new one is up, which also frees its WebGL context
    if (old) setTimeout(() => old.remove(), 400);
  }

  // the model picker: a combobox you can type into to filter the models, then pick with a click,
  // the arrow keys and Enter. Esc or clicking away closes it and puts the current model's name back.
  // On a phone the header's box only opens a bottom sheet: an opaque panel with its own search box at the
  // top and the list under it. The keyboard comes up only when you tap that search box.
  function combobox(d, m) {
    const w = d.defaultView;
    const sheetMode = () => w.matchMedia("(max-width: 760px)").matches;
    const wrap = d.createElement("div");
    wrap.className = "bp-model";
    const input = d.createElement("input");
    const list = d.createElement("ul");
    list.className = "bp-list"; list.id = "bp-list"; list.hidden = true;
    list.setAttribute("role", "listbox"); list.setAttribute("aria-label", "Models");
    Object.entries({ type: "text", role: "combobox", "aria-label": "Model, type to search", "aria-autocomplete": "list",
      "aria-expanded": "false", "aria-controls": "bp-list", autocomplete: "off", spellcheck: "false", placeholder: "Search models" })
      .forEach(([k, v]) => input.setAttribute(k, v));
    input.value = m.label;
    wrap.append(input, list);
    // presses in the list (a tap's mousedown too) mustn't take focus from the input, which would close the list
    list.addEventListener("mousedown", e => e.preventDefault());
    // the bottom sheet: a scrim behind it, then a grip, the search box with a close button, and the list
    const scrim = d.createElement("div");
    scrim.className = "bp-scrim"; scrim.hidden = true;
    const sheet = d.createElement("div");
    sheet.className = "bp-sheet"; sheet.hidden = true;
    Object.entries({ role: "dialog", "aria-modal": "true", "aria-label": "Choose a model" }).forEach(([k, v]) => sheet.setAttribute(k, v));
    const search = d.createElement("input");
    Object.entries({ type: "search", role: "combobox", "aria-label": "Search models", "aria-autocomplete": "list", "aria-expanded": "true",
      "aria-controls": "bp-list", autocomplete: "off", spellcheck: "false", enterkeyhint: "go", placeholder: "Search models" })
      .forEach(([k, v]) => search.setAttribute(k, v));
    const closeBtn = d.createElement("button");
    closeBtn.type = "button"; closeBtn.className = "bp-x"; closeBtn.setAttribute("aria-label", "Close"); closeBtn.textContent = "×";
    const grip = d.createElement("div"), head = d.createElement("div");
    grip.className = "bp-grip"; head.className = "bp-sheet-head";
    head.append(search, closeBtn);
    sheet.append(grip, head);
    d.body.append(scrim, sheet);
    let inSheet = false;
    const field = () => inSheet ? search : input;
    let items = [], options = [], hi = -1;
    const norm = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    function render(q) {
      const words = norm(q).split(/\s+/).filter(Boolean);
      items = MODELS.filter(x => words.every(w => norm(x.label + " " + x.id + " " + (x.tags || "") + " " + (x.category || "")).includes(w)));
      list.textContent = "";
      // models come grouped by category (models/index.json lists them in order); each group gets a heading
      const opts = [];
      items.forEach((x, i) => {
        if (x.category && (i === 0 || items[i - 1].category !== x.category)) {
          const h = d.createElement("li");
          h.className = "group"; h.setAttribute("role", "presentation"); h.textContent = x.category;
          list.appendChild(h);
        }
        const li = d.createElement("li");
        li.id = "bp-opt-" + x.id; li.setAttribute("role", "option");
        li.classList.toggle("current", x.id === m.id);
        li.textContent = x.label;
        if (x.kind) { const k = d.createElement("small"); k.textContent = x.kind; li.appendChild(k); }
        // a mouse picks on press; a finger picks on a tap, so dragging scrolls the list instead of picking
        let viaMouse = false;
        li.addEventListener("pointerdown", e => { e.preventDefault(); viaMouse = e.pointerType === "mouse"; if (viaMouse) choose(i); });
        li.addEventListener("click", () => { if (!viaMouse) choose(i); });
        li.addEventListener("pointermove", e => { if (e.pointerType === "mouse") highlight(i); });
        list.appendChild(li); opts.push(li);
      });
      options = opts;
      if (!items.length) { const li = d.createElement("li"); li.className = "none"; li.textContent = "No matching model"; list.appendChild(li); }
      highlight(Math.max(0, items.findIndex(x => x.id === m.id)));
    }
    function highlight(i) {
      hi = items.length ? Math.max(0, Math.min(items.length - 1, i)) : -1;
      options.forEach((li, j) => li.setAttribute("aria-selected", String(j === hi)));
      if (hi >= 0) {
        field().setAttribute("aria-activedescendant", "bp-opt-" + items[hi].id);
        const head = options[hi].previousElementSibling;   // keep a group's heading in view with its first model
        (head && head.classList.contains("group") ? head : options[hi]).scrollIntoView({ block: "nearest" });
        options[hi].scrollIntoView({ block: "nearest" });
      }
      else field().removeAttribute("aria-activedescendant");
    }
    function open(q) {
      render(q);
      list.hidden = false; wrap.classList.add("open"); input.setAttribute("aria-expanded", "true");
    }
    // the sheet opens without focusing its search box, so no keyboard until that box is tapped
    function openSheet() {
      if (inSheet) return;
      inSheet = true;
      sheet.appendChild(list);
      search.value = "";
      scrim.hidden = sheet.hidden = false;
      open("");
      fit();
    }
    function close() {
      if (inSheet) {
        inSheet = false;
        search.blur();
        scrim.hidden = sheet.hidden = true;
        wrap.appendChild(list);
      }
      list.hidden = true; wrap.classList.remove("open"); input.setAttribute("aria-expanded", "false");
      input.value = m.label;
    }
    function choose(i) {
      const x = items[i];
      close();
      if (!x) return;
      input.value = x.label;
      input.blur();
      show(x.id);
    }
    // with the keyboard up, keep the sheet above it and inside what's left of the screen
    function fit() {
      const vv = w.visualViewport;
      if (!inSheet || !vv) return;
      sheet.style.bottom = Math.max(0, Math.round(w.innerHeight - vv.height - vv.offsetTop)) + "px";
      sheet.style.maxHeight = Math.round(vv.height * 0.86) + "px";
    }
    if (w.visualViewport) { w.visualViewport.addEventListener("resize", fit); w.visualViewport.addEventListener("scroll", fit); }
    // on a phone the header's box is only a button for the sheet: read-only, so tapping it brings up no keyboard
    function syncMode() {
      const s = sheetMode();
      input.readOnly = s;
      if (s) input.setAttribute("inputmode", "none"); else input.removeAttribute("inputmode");
      if (!s && inSheet) close();
    }
    syncMode();
    w.addEventListener("resize", () => { syncMode(); fit(); });
    input.addEventListener("focus", () => {
      if (sheetMode()) { input.blur(); openSheet(); return; }
      input.value = ""; open("");
    });
    input.addEventListener("click", () => { if (sheetMode()) openSheet(); });
    input.addEventListener("input", () => open(input.value));
    input.addEventListener("blur", () => { if (!inSheet) close(); });
    search.addEventListener("input", () => render(search.value));
    scrim.addEventListener("click", close);
    closeBtn.addEventListener("click", close);
    const keys = e => {
      e.stopPropagation();   // typing here never reaches the page's own shortcuts
      if (e.key === "ArrowDown") { e.preventDefault(); if (list.hidden) open(""); else highlight(hi + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); highlight(hi - 1); }
      else if (e.key === "Enter") { e.preventDefault(); choose(hi); }
      else if (e.key === "Escape") { e.preventDefault(); close(); input.blur(); }
    };
    input.addEventListener("keydown", keys);
    search.addEventListener("keydown", keys);
    sheet.addEventListener("keydown", e => { if (e.key === "Escape") { e.stopPropagation(); close(); } });
    return wrap;
  }

  function attach(f, m) {
    const w = f.contentWindow, d = f.contentDocument;
    if (!d) { f.classList.add("shown"); return; }
    document.title = d.title || m.label;
    const st = d.createElement("style");
    st.textContent = CSS;
    d.head.appendChild(st);
    const themes = d.querySelector(".themes");
    // back to the grid of every model
    const header = d.querySelector("header");
    if (header) {
      const back = d.createElement("button");
      back.type = "button"; back.className = "bp-home"; back.setAttribute("aria-label", "All models");
      back.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1h4v4H1zM7 1h4v4H7zM1 7h4v4H1zM7 7h4v4H7z" fill="currentColor"/></svg><span>All models</span>';
      back.addEventListener("click", () => { history.pushState(null, "", location.pathname + location.search); showHome(); });
      header.insertBefore(back, header.firstChild);
      const mark = d.querySelector(".mark");
      if (mark) mark.addEventListener("click", e => { e.preventDefault(); back.click(); });
    }
    if (themes) {
      const wrap = combobox(d, m);
      // render style: the white line drawing or shaded, realistic materials
      const seg = d.createElement("div");
      seg.className = "bp-style"; seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "Render style");
      const btns = [["blueprint", "Lines"], ["realistic", "Shaded"], ["photo", "Photo"]].map(([s, t]) => {
        const b = d.createElement("button");
        b.type = "button"; b.dataset.s = s; b.textContent = t;
        b.addEventListener("click", () => { style = s; store.set("blueprints-style", s); sync(); });
        seg.appendChild(b);
        return b;
      });
      const sync = () => {
        btns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === style)));
        if (w.__bpSetStyle) w.__bpSetStyle(style);
      };
      sync();
      const box = d.createElement("div");
      box.className = "bp-controls";
      box.append(wrap, seg);
      const before = d.querySelector(".tools") || themes;
      before.parentNode.insertBefore(box, before);
      // keep the theme (and whether it's inverted) the same from model to model: the page has just saved it
      d.querySelectorAll(".swatch").forEach(b => b.addEventListener("click", () => {
        theme = store.get(m.key) || theme;
        store.set("blueprints-theme", theme);
        paint();
      }));
    }
    requestAnimationFrame(() => f.classList.add("shown"));
    try { w.focus(); } catch (e) {}   // so "/" and "." reach the page straight away
  }

  // a model's address is #id; no hash is the home page. Back and forward move between them.
  const route = () => { const id = location.hash.slice(1); if (id) show(id); else showHome(); };
  addEventListener("hashchange", route);
  addEventListener("popstate", route);
  route();
})();
</script>
</body>
</html>
