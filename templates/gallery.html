<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* The home page is a grid of every model; a model opens in a full-window frame, one page at a time.
   tools/build.js fills in the placeholders below; the grid's pictures are thumbs/<id>.webp (tools/thumbs.js). */
:root { --bg: #141414; --fg: #ffffff; --fg-2: rgba(255,255,255,.64); --fg-3: rgba(255,255,255,.4); --rule: rgba(255,255,255,.14); --tile: rgba(255,255,255,.025);
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; --display: "Archivo", "Helvetica Neue", Arial, sans-serif; }
/* nothing from the browser's own look: selection, scrollbars, focus rings and search boxes are the site's */
* { -webkit-tap-highlight-color: transparent; }
::selection { background: var(--fg); color: var(--bg); }
html { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 8px; }
:focus { outline: none; }
:focus-visible { outline: 1px dashed var(--fg); outline-offset: 3px; }
input[type="search"]::-webkit-search-cancel-button, input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; transition: background-color .45s ease, color .45s ease; }
iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; opacity: 0; transition: opacity .35s ease; }
iframe.shown { opacity: 1; }

#home { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; transition: opacity .3s ease; }
#home[hidden] { display: none; }
/* the hero: half the viewport, everything centred; a slim bar on top with the docs link and the theme swatches */
.hero { position: relative; min-height: 50vh; min-height: 50svh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 18px; padding: calc(env(safe-area-inset-top, 0px) + 72px) clamp(16px, 4vw, 56px) 48px; }
.topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) clamp(16px, 4vw, 56px) 0; }
.topbar .mark { font: 800 15px/1 var(--display); font-stretch: 125%; letter-spacing: -.01em; color: var(--fg); text-decoration: none; }
.topbar nav { display: flex; align-items: center; gap: 12px; }
.pill { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); text-decoration: none;
  border: 1px solid var(--rule); border-radius: 999px; padding: 11px 14px; transition: border-color .2s, color .2s; }
.pill:hover, .pill:focus-visible { color: var(--fg); border-color: var(--fg); outline: none; }
.hero h1 { margin: 0; font: 800 clamp(34px, 6.4vw, 92px)/.95 var(--display); font-stretch: 125%; letter-spacing: -.035em; }
.hero p { margin: 0; max-width: 560px; font: 400 clamp(12px, 1.1vw, 15px)/1.6 var(--mono); letter-spacing: .02em; color: var(--fg-2); }
.hero-actions { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; width: 100%; margin-top: 6px; }
.pill.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pill.solid:hover { opacity: .88; color: var(--bg); }
.home-search { width: min(340px, 100%); text-align: center; font: 500 12px/1 var(--mono); letter-spacing: .06em; color: var(--fg); background: transparent;
  border: 1px solid var(--rule); border-radius: 999px; padding: 12px 16px; outline: none; transition: border-color .2s; -webkit-appearance: none; appearance: none; }
.home-search::placeholder { color: var(--fg-3); text-transform: uppercase; letter-spacing: .1em; }
.home-search:focus, .home-search:hover { border-color: var(--fg); }
.home-themes { display: flex; gap: 6px; padding: 5px; border: 1px solid var(--rule); border-radius: 999px; }
.home-themes button { width: 26px; height: 26px; border-radius: 50%; padding: 0; cursor: pointer; border: 1px solid var(--rule);
  background: linear-gradient(135deg, var(--sw-bg) 50%, var(--sw-fg) 50%); transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
.home-themes button.inv { background: linear-gradient(135deg, var(--sw-fg) 50%, var(--sw-bg) 50%); }
.home-themes button:hover { transform: scale(1.12); }
.home-themes button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--fg); }

/* three columns across the full width, no gaps: the cells are divided by hairlines (each draws its right and bottom
   edge; the right-hand column's is clipped off at the window's edge) */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule); overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 0px); }
.tile { position: relative; display: block; color: inherit; text-decoration: none; outline: none; box-shadow: 1px 0 0 var(--rule), 0 1px 0 var(--rule); transition: background-color .25s; }
.tile[hidden] { display: none; }
.tile:hover, .tile:focus-visible { background: var(--tile); }
.art { position: relative; aspect-ratio: 4 / 3; }
.art::before { content: ""; position: absolute; inset: 9% 9% 14%; background: var(--fg); opacity: .88;
  -webkit-mask: var(--img) center / contain no-repeat; mask: var(--img) center / contain no-repeat; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .25s; }
.tile:hover .art::before, .tile:focus-visible .art::before { transform: scale(1.04); opacity: 1; }
.cap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 0 clamp(10px, 1.6vw, 24px) clamp(10px, 1.4vw, 20px); }
.cap b { font: 500 clamp(9px, 1vw, 13px)/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.cap span { font: 400 clamp(8px, .85vw, 11px)/1.3 var(--mono); letter-spacing: .06em; color: var(--fg-3); text-transform: lowercase; white-space: nowrap; }
.tile:hover .cap span, .tile:focus-visible .cap span { color: var(--fg-2); }
.empty { grid-column: 1 / -1; font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); padding: 4vw 0; text-align: center; }
@media (max-width: 760px) { .cap span { display: none; } .topbar .mark { display: none; } .topbar { justify-content: flex-end; } }
@media (prefers-reduced-motion: reduce) { .art::before { transition: none; } }
</style>
</head>
<body>
<main id="home" hidden>
  <header class="hero">
    <div class="topbar">
      <a class="mark" href="./">Blueprint Models</a>
      <nav><a class="pill" href="docs/">Embed docs</a><div class="home-themes" id="home-themes" role="group" aria-label="Theme"></div></nav>
    </div>
    <h1>Blueprint Models</h1>
    <p><span id="home-count"></span> you can turn, take apart and see working, and drop into your own site or app.</p>
    <div class="hero-actions">
      <input class="home-search" id="home-search" type="search" placeholder="Search models" aria-label="Search models" autocomplete="off" spellcheck="false">
      <a class="pill solid" href="docs/">Embed them</a>
    </div>
  </header>
  <div class="grid" id="grid"></div>
</main>
<!--PAGE_JS-->
<script>
(function () {
  "use strict";
  /* Filled in by tools/build.js. Two builds share this shell:
     - dist/index.html (Vercel): MODELS entries carry `src` (viewer.html?model=<id>): the one viewer page, told which
       model by its address, loads the shared engine, its controls (ui.js) and that model's two files;
       TEMPLATE, ENGINE and UI stay empty.
     - index.html (one file, opens from disk): MODELS entries carry the model's geometry and model code;
       TEMPLATE, ENGINE and UI hold the page template, the engine and the controls once, and the PAGE_JS slot above
       holds templates/page.js, which puts a page together when it's opened.
     Either way the model pages are frames, and they ask this page (window.BP_GALLERY below) to open another model. */
  const MODELS = /*MODELS*/[];
  const TEMPLATE = /*TEMPLATE*/"";
  const ENGINE = /*ENGINE*/"";
  const UI = /*UI*/"";
  const DEFAULT = "macintosh";
  const MANIFEST_JS = "window.BP_MANIFEST = " + JSON.stringify(MODELS.map(({ id, label, kind, tags, key, category }) => ({ id, label, kind, tags, key, category }))).replace(/</g, "\\u003c") + ";\n";
  // background / line colour per theme, as in the pages; a theme is stored as "name" or "name:inv"
  const THEMES = { dark: ["#141414", "#ffffff"], light: ["#f3f3f1", "#141414"], amber: ["#ffdf77", "#141414"],
    navy: ["#0d2c51", "#ffffff"], lime: ["#c8f25c", "#123d22"] };
  const root = document.documentElement;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let theme = store.get("blueprints-theme") || "dark";
  if (!THEMES[theme.split(":")[0]]) theme = "dark";
  const rgba = (hex, a) => "rgba(" + [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(", ") + ", " + a + ")";
  function paint() {
    const [t, inv] = theme.split(":");
    let [bg, fg] = THEMES[t];
    if (inv === "inv") [bg, fg] = [fg, bg];
    const s = root.style;
    s.setProperty("--bg", bg); s.setProperty("--fg", fg); s.setProperty("--fg-2", rgba(fg, 0.64)); s.setProperty("--fg-3", rgba(fg, 0.42));
    s.setProperty("--rule", rgba(fg, 0.16)); s.setProperty("--tile", rgba(fg, 0.03));
    document.querySelectorAll("#home-themes button").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.t === t));
      b.classList.toggle("inv", b.dataset.t === t && inv === "inv");
    });
  }

  // ---------- the home page: every model in a three-column grid ----------
  const home = document.getElementById("home"), grid = document.getElementById("grid"), search = document.getElementById("home-search");
  document.getElementById("home-count").textContent = MODELS.length + " interactive illustrations";
  const themesEl = document.getElementById("home-themes");
  Object.entries(THEMES).forEach(([t, [bg, fg]]) => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.t = t; b.title = t[0].toUpperCase() + t.slice(1) + " theme (click again to invert)";
    b.style.setProperty("--sw-bg", bg); b.style.setProperty("--sw-fg", fg);
    // a new swatch switches theme; the active one again swaps its background and lines
    b.addEventListener("click", () => {
      const [cur, inv] = theme.split(":");
      theme = t === cur ? (inv === "inv" ? t : t + ":inv") : t;
      store.set("blueprints-theme", theme); paint();
    });
    themesEl.appendChild(b);
  });
  paint();
  const tiles = MODELS.map(m => {
    const a = document.createElement("a");
    a.className = "tile"; a.href = "#" + m.id; a.title = m.label;
    const art = document.createElement("div");
    art.className = "art"; art.style.setProperty("--img", "url('thumbs/" + m.id + ".webp')");
    const cap = document.createElement("div");
    cap.className = "cap";
    const b = document.createElement("b"), sp = document.createElement("span");
    b.textContent = m.label; sp.textContent = m.category || m.kind || "";
    cap.append(b, sp); a.append(art, cap);
    grid.appendChild(a);
    return { a, m };
  });
  const none = document.createElement("p");
  none.className = "empty"; none.textContent = "No matching model"; none.hidden = true; grid.appendChild(none);
  const norm = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  search.addEventListener("input", () => {
    const words = norm(search.value).split(/\s+/).filter(Boolean);
    let n = 0;
    tiles.forEach(({ a, m }) => { const ok = words.every(w => norm(m.label + " " + m.id + " " + (m.tags || "") + " " + (m.category || "")).includes(w)); a.hidden = !ok; n += ok; });
    none.hidden = n > 0;
  });
  function showHome() {
    current = null;
    if (frame) { const f = frame; frame = null; f.classList.remove("shown"); setTimeout(() => f.remove(), 350); }
    document.title = "Blueprint Models";
    paint();
    home.hidden = false;
  }

  let frame = null, current = null;
  function show(id) {
    const m = MODELS.find(x => x.id === id);
    if (!m) { if (location.hash) history.replaceState(null, "", location.pathname + location.search); return showHome(); }
    if (current === m.id && frame) return;
    current = m.id;
    home.hidden = true;
    store.set("blueprints-model", m.id);
    if (location.hash.slice(1) !== m.id) history.replaceState(null, "", "#" + m.id);
    // each page reads its theme from its own key at startup: hand it the current one
    MODELS.forEach(x => store.set(x.key, theme));
    const old = frame;
    frame = document.createElement("iframe");
    frame.title = m.label;
    const f = frame;
    f.addEventListener("load", () => {
      try { document.title = f.contentDocument.title || m.label; } catch (e) { document.title = m.label; }
      requestAnimationFrame(() => f.classList.add("shown"));
      try { f.contentWindow.focus(); } catch (e) {}   // so "/" and "." reach the page straight away
    }, { once: true });
    if (m.src) f.src = m.src;
    else f.srcdoc = BP_page.pageHtml(TEMPLATE, { manifest: { code: MANIFEST_JS }, geometry: { code: m.geometry }, model: { code: m.model }, engine: { code: ENGINE }, ui: { code: UI } });
    document.body.appendChild(frame);
    // the old page goes once the new one is up, which also frees its WebGL context
    if (old) setTimeout(() => old.remove(), 400);
  }

  // what a model page in a frame (engine/ui.js) asks of the gallery: open another model, go back to the grid, and the
  // theme it was just given, so the grid has the same colours when it comes back
  window.BP_GALLERY = {
    show,
    home() { history.pushState(null, "", location.pathname + location.search); showHome(); },
    setTheme(t) { theme = t; store.set("blueprints-theme", t); paint(); },
  };
  // a model's address is #id; no hash is the home page. Back and forward move between them.
  const route = () => { const id = location.hash.slice(1); if (id) show(id); else showHome(); };
  addEventListener("hashchange", route);
  addEventListener("popstate", route);
  route();
})();
</script>
</body>
</html>
